services:
  alninja:
    # Built and published by .github/workflows/docker.yml on every push to main.
    # To build locally instead, replace `image:` with `build: .`
    image: ghcr.io/thefonze74065/alninja:latest
    pull_policy: always
    container_name: alninja
    # Run as the user that owns the data directory. 568:568 is TrueNAS's built-in `apps` user;
    # remove this line to use the image default (1000:1000).
    user: "568:568"
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      POLL_INTERVAL_MINUTES: 10
      FRESH_HOURS: 48
      ARCHIVE_RAW: "true"
    volumes:
      # On TrueNAS, point this at a dataset, e.g. /mnt/tank/apps/alninja:/data
      # That dataset must be writable by the `user:` above.
      - ./data:/data
