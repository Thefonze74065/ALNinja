services:
  alninja:
    # Built and published by .github/workflows/docker.yml on every push to main.
    # To build locally instead, replace `image:` with `build: .`
    image: ghcr.io/thefonze74065/alninja:latest
    pull_policy: always
    container_name: alninja
    # Run as the user that owns the data directory. 568:568 is TrueNAS's built-in `apps` user;
    # remove this line to use the image default (1000:1000).
    user: "568:568"
    restart: unless-stopped
    # Hardening: the app only writes to /data (and /tmp).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
    environment:
      POLL_INTERVAL_MINUTES: 10
      FRESH_HOURS: 48
      ARCHIVE_RAW: "true"
      # Behind Cloudflare (incl. a Cloudflare Tunnel) set this, or every visitor shares one rate limit.
      # TRUST_PROXY: cloudflare
      # Set (or change) to replay the raw archive into a fresh database on the next start; see README.
      # REBUILD: "1"
      # Set (or change) to DELETE all collected history on the next start and begin fresh.
      # RESET_DATA: "1"
    volumes:
      # On TrueNAS, point this at a dataset, e.g. /mnt/tank/apps/alninja:/data
      # That dataset must be writable by the `user:` above.
      - ./data:/data
